name: Infrastructure
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/check_repo.py
      - run: python -m unittest discover -s tools/agent_hub/tests -v
      - run: python -m pip install uv==0.11.28
      - run: uv sync --project tools/agent_hub --locked
      - run: uv run --project tools/agent_hub --locked python tools/agent_hub/smoke_mcp.py
